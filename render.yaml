# https://render.com/docs/blueprint-spec
#
# This app is an npm monorepo: keep "Root Directory" EMPTY in the Render UI (or omit rootDir here) so
# `npm install` and `npm run build` run at the repo root. "next start" in ./frontend needs a
# prior `next build` (produces ./frontend/.next). Do not set Build to `npm install` only.
# Do not set Root Directory to "frontend" unless Build is `npm install && npm run build` there
# and workspace @financeos/* resolution still works (not recommended; use root).
#
# Optional Google sign-in: in the Render dashboard add GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
# (OAuth Web client). Authorized redirect URI must be: {your NEXTAUTH_URL}/api/auth/callback/google
#
services:
  - type: web
    name: Finance-App
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    # Use `/` so checks stay 200 if Mongo is not set yet; `/api/health` can return 503 without DB.
    healthCheckPath: /
