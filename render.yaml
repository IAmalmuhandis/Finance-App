# https://render.com/docs/blueprint-spec
#
# Required env vars — set these in the Render dashboard (Settings → Environment):
#   DATABASE_URL   — MongoDB Atlas SRV URI
#   NEXTAUTH_URL   — your Render service URL, e.g. https://arzo.onrender.com
#   NEXTAUTH_SECRET — long random string (openssl rand -hex 32)
#   GOOGLE_CLIENT_ID     — Google OAuth Web client ID (optional, enables Google sign-in)
#   GOOGLE_CLIENT_SECRET — Google OAuth Web client secret (optional)
#
# After deploying, set EXPO_PUBLIC_API_BASE_URL in Mobile/.env to the NEXTAUTH_URL above.
#
services:
  - type: web
    name: Arzo
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
