name: Keep Render Alive

on:
  schedule:
    - cron: "*/14 * * * *"  # every 14 minutes (backup — primary ping is cron-job.org)
  workflow_dispatch:          # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://finance-app-0cwn.onrender.com/api/health)
          echo "Response status: $status"
          if [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
            echo "Server is awake"
          else
            echo "Server returned $status — may be cold starting"
          fi
